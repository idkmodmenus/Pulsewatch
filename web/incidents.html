<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseWatch — Incidents</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" /><link rel="stylesheet" href="css/components.css" /><link rel="stylesheet" href="css/charts.css" /><link rel="stylesheet" href="css/responsive.css" />
  <script>window.PW_API_BASE='/api';</script>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <a href="index.html" class="sidebar__brand"><div class="sidebar__logo"><svg viewBox="0 0 28 28" fill="none"><rect width="28" height="28" rx="7" fill="#1e3a5f"/><polyline points="3,14 7,14 10,6 14,22 17,11 20,14 25,14" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span class="sidebar__brand-name">Pulse<span>Watch</span></span></a>
    <nav class="sidebar__nav"><ul style="list-style:none;padding:0;margin:0">
      <li class="sidebar__item"><a href="index.html"     class="sidebar__link"><span class="sidebar__link-icon"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg></span><span class="sidebar__link-label">Dashboard</span></a></li>
      <li class="sidebar__item"><a href="monitors.html"  class="sidebar__link"><span class="sidebar__link-icon"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><polyline points="1,8 4,8 6,3 9,13 11,6 13,8 15,8"/></svg></span><span class="sidebar__link-label">Monitors</span></a></li>
      <li class="sidebar__item"><a href="servers.html"   class="sidebar__link"><span class="sidebar__link-icon"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="1" y="2" width="14" height="5" rx="1"/><rect x="1" y="9" width="14" height="5" rx="1"/></svg></span><span class="sidebar__link-label">Servers</span></a></li>
      <li class="sidebar__item"><a href="incidents.html" class="sidebar__link"><span class="sidebar__link-icon"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 1.5L1 13.5h14L8 1.5z"/><line x1="8" y1="6" x2="8" y2="9"/></svg></span><span class="sidebar__link-label">Incidents</span></a></li>
      <li class="sidebar__item"><a href="analytics.html" class="sidebar__link"><span class="sidebar__link-icon"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><polyline points="1,12 5,7 8,9 11,5 15,2"/></svg></span><span class="sidebar__link-label">Analytics</span></a></li>
      <li class="sidebar__item"><a href="settings.html"  class="sidebar__link"><span class="sidebar__link-icon"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="2"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2"/></svg></span><span class="sidebar__link-label">Settings</span></a></li>
    </ul></nav>
    <div class="sidebar__footer">
      <div class="sidebar__user"><div class="sidebar__avatar" data-user-avatar>JD</div><div class="sidebar__footer-text"><div class="sidebar__user-name" data-user-name>—</div><div class="sidebar__org-name" data-org-name>—</div></div></div>
      <div class="sidebar__status-row"><div class="connection-indicator indicator--connecting" id="connection-indicator"><span class="indicator__dot"></span><span class="indicator__text">Connecting</span></div></div>
    </div>
  </aside>
  <div id="sidebar-overlay" class="sidebar-overlay"></div>

  <div class="main-area">
    <header class="topbar">
      <button class="topbar__mobile-toggle" id="sidebar-toggle" aria-label="Toggle menu"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="3" y1="5" x2="17" y2="5"/><line x1="3" y1="10" x2="17" y2="10"/><line x1="3" y1="15" x2="17" y2="15"/></svg></button>
      <div class="topbar__search"><div class="topbar__search-icon"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="7" cy="7" r="5"/><line x1="11.5" y1="11.5" x2="14" y2="14"/></svg></div><input id="global-search" type="search" placeholder="Search…" /></div>
      <div class="topbar__right">
        <button class="topbar__btn" id="refresh-btn" title="Refresh"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 8A6 6 0 112 8"/><polyline points="2,4 2,8 6,8"/></svg></button>
        <div class="dropdown-wrap"><button class="topbar__btn" data-dropdown="user-menu" aria-expanded="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="5" r="3"/><path d="M2 14c0-3 2.7-5 6-5s6 2 6 5"/></svg></button><div class="dropdown-menu" id="user-menu"><button class="dropdown-item dropdown-item--danger" id="logout-btn">Sign out</button></div></div>
      </div>
    </header>

    <main class="page-content">
      <div class="page-header">
        <div class="page-header__left">
          <h1 class="page-header__title">Incidents</h1>
          <p class="page-header__subtitle" id="incident-count-sub">Loading…</p>
        </div>
      </div>

      <!-- KPI row -->
      <div class="grid-4" style="margin-bottom:1.5rem">
        <div class="kpi-card"><div class="kpi-card__label">Open</div><div class="kpi-card__value kpi-card__value--danger" id="inc-kpi-open">—</div></div>
        <div class="kpi-card"><div class="kpi-card__label">Acknowledged</div><div class="kpi-card__value kpi-card__value--warn" id="inc-kpi-ack">—</div></div>
        <div class="kpi-card"><div class="kpi-card__label">Resolved (30d)</div><div class="kpi-card__value kpi-card__value--success" id="inc-kpi-resolved">—</div></div>
        <div class="kpi-card"><div class="kpi-card__label">Avg Duration</div><div class="kpi-card__value" id="inc-kpi-mttr">—</div></div>
      </div>

      <!-- Filters -->
      <div class="filter-bar" style="margin-bottom:1rem">
        <div class="filter-chips" id="inc-status-chips">
          <button class="filter-chip filter-chip--active" data-filter="">All</button>
          <button class="filter-chip" data-filter="open">Open</button>
          <button class="filter-chip" data-filter="acknowledged">Acknowledged</button>
          <button class="filter-chip" data-filter="resolved">Resolved</button>
        </div>
      </div>

      <!-- Incident list -->
      <div class="card" id="incidents-card">
        <div id="incidents-container"></div>
        <div class="card__footer"><button class="btn btn--ghost" id="load-more-incidents">Load more</button></div>
      </div>
    </main>
  </div>
</div>

<!-- Incident detail slide-over -->
<div class="modal-backdrop" id="incident-detail-modal">
  <div class="modal modal--lg">
    <div class="modal__header">
      <h2 class="modal__title" id="incident-detail-title">Incident</h2>
      <button class="modal__close" data-modal-close>&times;</button>
    </div>
    <div class="modal__body" id="incident-detail-body">Loading…</div>
    <div class="modal__footer" id="incident-detail-footer"></div>
  </div>
</div>

<script type="module" src="js/incidents.js"></script>
</body>
</html>
